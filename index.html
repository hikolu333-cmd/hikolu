<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hikolu: Discord, Telegram и Steam">
<title>Визитка Hikolu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: тёмный стол, на нём веером лежат три коллекционные голографические карты.
   Арт каждой карты = аватарка из этого сервиса. Карты наклоняются за курсором и переливаются фольгой. */
:root {
  --bg: #0b0a11;        /* стол */
  --surface: #15131d;   /* тело карты */
  --fg: #ece9f5;        /* основной текст */
  --muted: #9690aa;     /* подписи */
  --line: #2b2838;      /* тонкие рамки */
  --c-discord: #5865F2;
  --c-telegram: #2AABEE;
  --c-steam: #b9c9d8;
  --font-display: 'Unbounded', 'Arial Black', sans-serif;
  --font-body: 'Golos Text', system-ui, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: clip;
}
body::before { /* три тусклых пятна света в цветах сервисов */
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(42vmax 32vmax at 12% 78%, color-mix(in srgb, var(--c-discord) 20%, transparent), transparent 70%),
    radial-gradient(38vmax 30vmax at 52% 108%, color-mix(in srgb, var(--c-telegram) 16%, transparent), transparent 70%),
    radial-gradient(42vmax 32vmax at 90% 72%, color-mix(in srgb, var(--c-steam) 11%, transparent), transparent 70%);
  pointer-events: none;
}

.wrap {
  position: relative;
  max-width: 1080px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 40px);
  padding-block: clamp(32px, 6vw, 64px) 56px;
  display: flex; flex-direction: column;
  gap: clamp(40px, 7vw, 72px);
}

/* шапка */
.top { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.label {
  margin: 0;
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
}
.top h1 {
  margin: 0;
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(44px, 11vw, 112px);
  line-height: 1; letter-spacing: -.02em; text-transform: uppercase;
  overflow-wrap: anywhere;
  color: var(--fg);
  background: linear-gradient(100deg, var(--fg) 20%, var(--c-discord) 40%, var(--c-telegram) 55%, var(--fg) 75%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: sweep 9s ease-in-out infinite alternate;
}
.top .sub { margin: 0; color: var(--muted); font-size: 17px; }

/* стол с картами */
.dim { /* затемнение стола, пока карта увеличена */
  position: fixed; inset: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  opacity: 0; pointer-events: none;
  transition: opacity .35s ease;
}
.dim.on { opacity: 1; pointer-events: auto; cursor: zoom-out; }

.deck {
  --gap: clamp(8px, 2vw, 28px);
  display: flex; justify-content: center; align-items: flex-start;
  gap: var(--gap);
}
.seat { /* место карты: отвечает за веер, обмен местами и увеличение */
  --d: 0; --fan: 0deg; --drop: 0px; --zoom: 1.3;
  flex: 0 1 300px; min-width: 0;
  perspective: 650px;
  rotate: var(--fan);
  translate: calc(var(--d) * (100% + var(--gap))) var(--drop);
  transition: rotate .5s cubic-bezier(.2, .9, .2, 1), translate .5s cubic-bezier(.2, .9, .2, 1), scale .5s cubic-bezier(.2, .9, .2, 1);
  animation: deal .7s cubic-bezier(.2, .9, .2, 1) both;
  cursor: zoom-in;
}
.seat[data-pos="0"] { --fan: -7deg; --drop: 26px; }
.seat[data-pos="1"] { z-index: 1; animation-delay: .08s; }
.seat[data-pos="2"] { --fan: 7deg; --drop: 26px; animation-delay: .16s; }
.seat:hover { --fan: 0deg; --drop: -10px; z-index: 2; }
.seat.focus { --fan: 0deg; --drop: 0px; scale: var(--zoom); z-index: 10; cursor: zoom-out; }

.card {
  --mx: 50%; --my: 50%; --rx: 0deg; --ry: 0deg;
  position: relative;
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px;
  border-radius: 18px;
  background:
    linear-gradient(165deg, color-mix(in srgb, var(--c) 30%, var(--surface)) 0%, var(--surface) 55%, color-mix(in srgb, var(--c) 12%, var(--surface)) 100%);
  border: 1px solid color-mix(in srgb, var(--c) 55%, var(--line));
  box-shadow:
    0 30px 50px -20px #000,
    0 0 60px -22px var(--c);
  transform: rotateX(var(--rx)) rotateY(var(--ry));
  transition: transform .2s ease-out;
  overflow: hidden;
}
.card::after { /* голографическая фольга */
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, .5), transparent 42%),
    repeating-linear-gradient(115deg,
      #ff5ea8 0%, #ffd66b 8%, #6bffb8 16%, #5ec8ff 24%, #b98bff 32%, #ff5ea8 40%);
  background-size: 100% 100%, 220% 220%;
  background-position: 0 0, var(--mx) var(--my);
  mix-blend-mode: color-dodge;
  opacity: .13;
  transition: opacity .3s ease;
  pointer-events: none;
  animation: foil 7s ease-in-out infinite alternate;
}
.seat:hover .card::after { opacity: .3; animation: none; }

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.card-head h2 {
  margin: 0; min-width: 0;
  font-family: var(--font-display); font-weight: 500; font-size: 18px;
  overflow-wrap: anywhere;
}
.card-head .ico { flex: none; font-size: 22px; color: var(--c); line-height: 1; }

.art { /* окно арта: сюда встаёт аватарка */
  position: relative;
  aspect-ratio: 1; max-width: 100%;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
  background: color-mix(in srgb, var(--c) 16%, var(--bg));
  overflow: hidden;
}
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  color: var(--c);
  background-image: radial-gradient(color-mix(in srgb, var(--c) 30%, transparent) 1px, transparent 1.2px);
  background-size: 12px 12px;
}
.ph .big { font-size: clamp(56px, 9vw, 92px); line-height: 1; }
.ph .cap { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.type {
  margin: 0;
  padding: 5px 10px;
  border-radius: 6px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--fg);
  background: color-mix(in srgb, var(--c) 22%, transparent);
}

.box { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.handle { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.nick {
  min-width: 0; overflow-wrap: anywhere; user-select: all;
  font-family: var(--font-mono); font-weight: 700; font-size: 17px;
}
.copy {
  position: relative; z-index: 1; flex: none;
  font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 8px; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.copy:hover { color: var(--fg); border-color: var(--c); }
.note { margin: 0; min-height: 3em; font-size: 14px; color: var(--muted); }

.open {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 11px 14px;
  border-radius: 10px;
  font: 600 15px var(--font-body);
  color: var(--bg); background: var(--c);
  border: 0; width: 100%; cursor: pointer;
  text-decoration: none;
  transition: filter .15s;
}
.open:hover { filter: brightness(1.15); }

.card-foot {
  display: flex; justify-content: space-between; gap: 8px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); font-variant-numeric: tabular-nums;
}

:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

@keyframes deal { from { opacity: 0; rotate: 0deg; scale: .9; } }
@keyframes foil { from { background-position: 0 0, 0% 0%; } to { background-position: 0 0, 100% 100%; } }
@keyframes sweep { from { background-position: 100% 0; } to { background-position: 0% 0; } }

@media (max-width: 820px) {
  .deck { flex-direction: column; align-items: center; gap: 24px; }
  .seat { flex: none; width: min(100%, 320px); translate: 0 calc(var(--d) * (100% + 24px)); }
  .seat[data-pos="0"], .seat[data-pos="2"] { --fan: -1.5deg; }
  .seat[data-pos="1"] { --fan: 1.5deg; }
  .seat:hover, .seat.focus { --fan: 0deg; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="dim" id="dim"></div>
<div class="wrap">
  <header class="top">
    <p class="label">Колода контактов · 3 карты</p>
    <h1>Hikolu</h1>
    <p class="sub">Нажми на карту, чтобы рассмотреть её поближе.</p>
  </header>

  <main class="deck" id="deck"></main>
</div>

  }

const deck = document.getElementById('deck');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = c => `<i class="fa-brands ${c.icon}" aria-hidden="true"></i>`;
const pad = n => String(n).padStart(3, '0');

CHANNELS.forEach((c, i) => {
  const seat = document.createElement('div');
  seat.className = 'seat';
  seat.dataset.pos = i;
  seat.innerHTML = `
    <article class="card" id="${c.id}" tabindex="0" style="--c: var(--c-${c.id})">
      <div class="card-head"><h2>${esc(c.name)}</h2><span class="ico">${ico(c)}</span></div>
      <div class="art">${c.avatar
        ? `<img src="${esc(c.avatar)}" alt="Аватар в ${esc(c.name)}">`
        : `<div class="ph"><span class="big">${ico(c)}</span><span class="cap">аватар из ${esc(c.name)}</span></div>`}</div>
      <p class="type">${esc(c.role)}</p>
      <div class="box">
        <div class="handle">
          <span class="nick">${esc(c.user)}</span>
          ${c.url ? `<button class="copy" type="button" id="copy-${c.id}" data-copy="Копировать">Копировать</button>` : ''}
        </div>
        <p class="note">${esc(c.note)}</p>
      </div>
      ${c.url
        ? `<a class="open" href="${esc(c.url)}" target="_blank" rel="noopener"><span>Открыть профиль</span><span aria-hidden="true">↗</span></a>`
        : `<button class="open" type="button" id="copy-${c.id}" data-copy="Скопировать ник"><span>Скопировать ник</span></button>`}
      <div class="card-foot"><span>Hikolu</span><span>${pad(i + 1)}/${pad(CHANNELS.length)}</span></div>
    </article>`;
  deck.append(seat);

  const card = seat.querySelector('.card');
  const copyBtn = seat.querySelector('[data-copy]');
  const copyText = copyBtn.querySelector('span') || copyBtn;
  copyBtn.addEventListener('click', () => {
    const done = () => { copyText.textContent = 'Скопировано'; setTimeout(() => copyText.textContent = copyBtn.dataset.copy, 1500); };
    const fallback = () => { // буфер недоступен: выделяем ник, чтобы скопировать вручную
      const r = document.createRange(); r.selectNodeContents(seat.querySelector('.nick'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    };
    try { navigator.clipboard.writeText(c.user).then(done, fallback); } catch (e) { fallback(); }
  });

  // наклон карты и блик фольги за курсором
  seat.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const r = card.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    card.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    card.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    card.style.setProperty('--ry', ((x - .5) * 34).toFixed(2) + 'deg');
    card.style.setProperty('--rx', ((.5 - y) * 28).toFixed(2) + 'deg');
  });
  seat.addEventListener('pointerleave', () => {
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
    card.style.setProperty('--mx', '50%');
    card.style.setProperty('--my', '50%');
  });

  seat.addEventListener('click', e => { if (!e.target.closest('a, button')) pick(i); });
  card.addEventListener('keydown', e => {
    if (e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(i); }
  });
});

// обмен местами: нажатая карта встаёт в центр и увеличивается, бывшая центральная уходит на её место
const seats = [...deck.children];
const dim = document.getElementById('dim');
const pos = seats.map((_, i) => i);
let focused = -1;

function render() {
  seats.forEach((s, i) => {
    s.dataset.pos = pos[i];
    s.style.setProperty('--d', pos[i] - i);
    s.classList.toggle('focus', i === focused);
  });
  dim.classList.toggle('on', focused >= 0);
}
function pick(i) {
  if (focused === i) { focused = -1; render(); return; }
  const mid = pos.indexOf(1);
  [pos[i], pos[mid]] = [pos[mid], pos[i]];
  focused = i;
  const card = seats[i].firstElementChild;
  const zoom = Math.max(1, Math.min(1.3, (innerHeight - 32) / card.offsetHeight, (innerWidth - 32) / card.offsetWidth));
  seats[i].style.setProperty('--zoom', zoom.toFixed(3));
  render();
  deck.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
dim.addEventListener('click', () => { focused = -1; render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && focused >= 0) { focused = -1; render(); } });
</script>
</body>
</html>
